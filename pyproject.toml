[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radarsim"
version = "0.1.0"
description = "A modular, reproducible radar simulation and target-tracking laboratory."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "radarsim-lab" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]
notebooks = [
    "jupyter>=1.0",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.scripts]
radarsim = "radarsim.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/radarsim"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["radarsim"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=radarsim --cov-report=term-missing"
